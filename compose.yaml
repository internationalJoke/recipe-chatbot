# Model keys come from your terminal (export / $env:) or from a .env file next to this file.
# Ports differ from the mushroom project so both can run at once.
services:
  database:
    image: postgres:17
    environment:
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: chatbot
      POSTGRES_DB: recipe_chat
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot -d recipe_chat"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
      target: migrator
    environment:
      DATABASE_URL: postgresql://chatbot:chatbot@database:5432/recipe_chat?schema=public
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      target: runner
    environment:
      DATABASE_URL: postgresql://chatbot:chatbot@database:5432/recipe_chat?schema=public
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.7}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-deepseek/deepseek-v4.1-flash}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      UPLOAD_DIR: /app/uploads
      RECIPE_SERVICE_URL: http://recipe-service:8000
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "3100:3000"
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      recipe-service:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "4300:80"
    depends_on:
      - backend
    restart: unless-stopped

  recipe-service:
    build:
      context: ./recipe-service
    environment:
      # "ontology" links names to the Open Food Facts taxonomy; "exact" is the original matching.
      RECIPE_MATCHER: ${RECIPE_MATCHER:-ontology}
    ports:
      - "8000:8000"
    # Loading the recipe CSVs takes a while; the backend waits until /health answers.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
